name: Publish Agent Desk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Build macOS ZIP and public guide
        env:
          AGENT_DESK_RELEASE_SHA: ${{ github.sha }}
        run: node share/build-release.mjs
      - name: Verify the extracted ZIP
        shell: bash
        run: |
          release_dir="$(mktemp -d "${RUNNER_TEMP}/agent-desk.XXXXXX")"
          unzip -q share/dist/download/agent-desk.zip -d "$release_dir"
          test -x "$release_dir/agent-desk/Start Agent Desk.command"
          npm --prefix "$release_dir/agent-desk" test
      - name: Publish the counted macOS download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="macos-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" share/dist/download/agent-desk.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Agent Desk macOS · ${GITHUB_SHA:0:12}" \
              --notes "macOS 다운로드용 ZIP입니다. 실행 방법과 활용 예시는 배포 페이지에 있습니다."
          fi
          uploaded="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | select(.name == "agent-desk.zip" and .state == "uploaded" and .size > 0) | .id')"
          test -n "$uploaded"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: share/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
